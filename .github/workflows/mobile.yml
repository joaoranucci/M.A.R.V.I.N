name: Mobile Android and iOS
on:
  push:
    branches: [main, 'codex/ios-first-release']
    paths: ['mobile/src/**', 'mobile/modules/**', 'mobile/plugins/**', 'mobile/scripts/**', 'mobile/assets/**', 'mobile/.maestro/**', 'mobile/*.json', 'mobile/*.js', 'mobile/.easignore', '.github/workflows/mobile.yml', 'marvin/gateway/**', 'tests/test_mobile*.py', 'requirements-mobile-gateway.txt']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml', 'docs/mobile/**']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Resolve audio asset peer through the installed Expo SDK
        run: npx expo install expo-asset
      - run: npx expo install --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx expo-doctor
      - name: Bundle iOS
        run: npx expo export --platform ios --max-workers 2 --output-dir dist/ios
      - name: Bundle Android
        run: npx expo export --platform android --max-workers 2 --output-dir dist/android
  ios-core:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Start ephemeral TLS fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/marvin-python"
          "$RUNNER_TEMP/marvin-python/bin/pip" install cryptography
          "$RUNNER_TEMP/marvin-python/bin/python" scripts/ios_tls_fixtures.py --output "$RUNNER_TEMP/marvin-certs" --serve > "$RUNNER_TEMP/marvin-tls.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/marvin-tls.pid"
          for attempt in $(seq 1 60); do
            if test -f "$RUNNER_TEMP/marvin-certs/fixtures.json"; then break; fi
            sleep 1
          done
          test -f "$RUNNER_TEMP/marvin-certs/fixtures.json"
          echo "MARVIN_CERT_FIXTURES=$RUNNER_TEMP/marvin-certs" >> "$GITHUB_ENV"
      - name: Compile and test native certificate and URLSession sources
        run: swift test --package-path modules/marvin-native/ios
      - name: Stop test servers
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/marvin-tls.pid"; then kill "$(cat "$RUNNER_TEMP/marvin-tls.pid")" || true; fi
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway dependencies without desktop audio
        run: python -m pip install -r requirements-core.txt -r requirements-mobile-gateway.txt httpx==0.28.1
      - name: Test shared Gateway contracts, device tokens and identity migration
        run: python -m unittest discover -s tests -p 'test_mobile*.py' -v
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - name: Generate Android project through CNG
        run: npx expo prebuild --platform android --no-install
      - name: Compile the changed Kotlin module
        working-directory: mobile/android
        run: ./gradlew :marvin-native:compileDebugKotlin --no-daemon --max-workers=2
  ios-app:
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generate iOS project through CNG
        run: npx expo prebuild --platform ios --no-install
      - name: Install native pods
        run: pod install --project-directory=ios
      - name: Verify generated native configuration
        run: node scripts/verify-ios-config.cjs
      - name: Compile release app for iOS Simulator
        run: xcodebuild -quiet -workspace ios/MARVIN.xcworkspace -scheme MARVIN -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/marvin-ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned simulator app
        run: ditto -c -k --keepParent "$RUNNER_TEMP/marvin-ios-build/Build/Products/Release-iphonesimulator/MARVIN.app" "$RUNNER_TEMP/MARVIN-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MARVIN-iOS-Simulator
          path: ${{ runner.temp }}/MARVIN-iOS-Simulator.zip
          retention-days: 14
  ios-ui:
    needs: [checks, ios-app]
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: MARVIN-iOS-Simulator
          path: ${{ runner.temp }}/ios-app-artifact
      - name: Install pinned Maestro CLI
        run: |
          curl -fLSs https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          node -e "const f=require('fs'),c=require('crypto');if(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex')!=='5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a')throw Error('Maestro checksum mismatch')" "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          MAESTRO_BIN="$(rg --files "$RUNNER_TEMP/maestro-cli" | rg '/bin/maestro$')"
          chmod +x "$MAESTRO_BIN"
          echo "MAESTRO_BIN=$MAESTRO_BIN" >> "$GITHUB_ENV"
      - name: Boot an iPhone simulator and install the release app
        run: |
          unzip -q "$RUNNER_TEMP/ios-app-artifact/MARVIN-iOS-Simulator.zip" -d "$RUNNER_TEMP/ios-app"
          node scripts/boot-ios-simulator.cjs "$RUNNER_TEMP/ios-app/MARVIN.app"
          mkdir -p "$RUNNER_TEMP/ios-evidence"
      - name: Validate screens, keyboard and cold/warm pairing links
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
        run: '"$MAESTRO_BIN" --device "$IOS_SIMULATOR_UDID" test --format junit --output "$RUNNER_TEMP/ios-evidence/results.xml" -e EVIDENCE_DIR="$RUNNER_TEMP/ios-evidence" .maestro/ios-smoke.yaml'
      - name: Make clean simulator screenshots available for visual review
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/codex/ios-first-release'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-ios-evidence.cjs "$RUNNER_TEMP/ios-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MARVIN-iOS-UI-evidence
          path: ${{ runner.temp }}/ios-evidence
          retention-days: 14
