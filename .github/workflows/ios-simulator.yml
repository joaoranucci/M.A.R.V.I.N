name: Run compiled iOS Simulator app
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Mobile workflow run containing MARVIN-iOS-Simulator for these application sources'
        required: true
        type: string
  workflow_call:
    inputs:
      artifact_run_id:
        required: true
        type: string
  # Verify the full simulator flow on the implementation branch; remove this trigger after recording evidence.
  push:
    branches: ['codex/ios-first-release']
    paths: ['.github/workflows/ios-simulator.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-simulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-ui:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the compiled artifact matches the application sources
        id: artifact
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run_id || 38891500385 }}
        run: |
          case "$SOURCE_RUN" in
            ''|*[!0-9]*) echo "A numeric build run is required." >&2; exit 1 ;;
          esac
          SOURCE_METADATA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '[.head_sha, .event] | join(" ")')"
          read -r SOURCE_SHA SOURCE_EVENT <<< "$SOURCE_METADATA"
          if test "$SOURCE_RUN" = "$GITHUB_RUN_ID"; then
            # The caller built this artifact from the same immutable checkout, including a PR merge commit.
            SOURCE_SHA="$(git rev-parse HEAD)"
          elif test "$SOURCE_EVENT" != push; then
            echo "For a previous build, select a push run to preserve exact checkout provenance." >&2
            exit 1
          fi
          if ! git diff --quiet "$SOURCE_SHA" HEAD -- mobile/src mobile/modules mobile/plugins mobile/assets 'mobile/*.json' 'mobile/*.js' 'mobile/*.ts'; then
            echo "The application differs from this compiled artifact. Select a newer successful iOS build." >&2
            exit 1
          fi
          echo "Reusing simulator build from run $SOURCE_RUN, commit $SOURCE_SHA"
          echo "run_id=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: MARVIN-iOS-Simulator
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact.outputs.run_id }}
          path: ${{ runner.temp }}/ios-app-artifact
      - name: Install pinned Maestro CLI
        run: |
          curl -fLSs https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          node -e "const f=require('fs'),c=require('crypto');if(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex')!=='5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a')throw Error('Maestro checksum mismatch')" "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          MAESTRO_BIN="$(find "$RUNNER_TEMP/maestro-cli" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$MAESTRO_BIN"
          chmod +x "$MAESTRO_BIN"
          echo "MAESTRO_BIN=$MAESTRO_BIN" >> "$GITHUB_ENV"
      - name: Boot an iPhone simulator and install the release app
        run: |
          unzip -q "$RUNNER_TEMP/ios-app-artifact/MARVIN-iOS-Simulator.zip" -d "$RUNNER_TEMP/ios-app"
          node scripts/boot-ios-simulator.cjs "$RUNNER_TEMP/ios-app/MARVIN.app"
          mkdir -p "$RUNNER_TEMP/ios-evidence"
      - name: Validate screens, keyboard and cold/warm pairing links
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: '"$MAESTRO_BIN" --device "$IOS_SIMULATOR_UDID" test --format junit --output "$RUNNER_TEMP/ios-evidence/results.xml" --test-output-dir "$RUNNER_TEMP/ios-evidence" --debug-output "$RUNNER_TEMP/ios-evidence" .maestro/ios-smoke.yaml'
      - name: Capture the last simulator screen after a failed test
        if: failure() && env.IOS_SIMULATOR_UDID != ''
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ios-evidence"
          xcrun simctl io "$IOS_SIMULATOR_UDID" screenshot "$RUNNER_TEMP/ios-evidence/00-final.png"
      - name: Make clean simulator screenshots available for visual review
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/codex/ios-first-release'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -d "$RUNNER_TEMP/ios-evidence"; then
            node scripts/publish-ios-evidence.cjs "$RUNNER_TEMP/ios-evidence"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MARVIN-iOS-UI-evidence
          path: ${{ runner.temp }}/ios-evidence
          retention-days: 14
