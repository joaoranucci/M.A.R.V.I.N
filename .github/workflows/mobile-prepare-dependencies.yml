name: Prepare Mobile dependency lockfile
on:
  push:
    branches: ['codex/ios-first-release']
    paths: ['.github/workflows/mobile-prepare-dependencies.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ios-first-release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bootstrap existing SDK and resolve peers
        working-directory: mobile
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install compatible tools through Expo
        working-directory: mobile
        run: |
          npx expo install react-dom@19.2.3
          npx expo install @react-native/metro-config@0.86.3 --dev
          npx expo install eslint eslint-config-expo --dev
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only the reproducible manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(mobile): resolve Expo 57 peers and lint dependencies"
            git push origin HEAD:codex/ios-first-release
          fi
