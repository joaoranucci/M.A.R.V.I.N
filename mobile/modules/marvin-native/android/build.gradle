plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.marvin'
version = '0.1.0'

android {
  namespace "expo.modules.marvinnative"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // OkHttpClientProvider (and OkHttp itself, exported by react-android).
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core-ktx:1.13.1'
}
