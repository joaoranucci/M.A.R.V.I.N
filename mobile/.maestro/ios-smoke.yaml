appId: dev.marvin.mobile
---
- launchApp:
    permissions:
      all: deny
- assertVisible: "MARVIN"
- assertNotVisible: "Mensagem para o MARVIN.*"
- takeScreenshot: "01-main"
- tapOn: "Digitar"
# A fresh iOS Simulator may show the system keyboard introduction on first focus.
- tapOn:
    text: "Continue|Continuar"
    optional: true
    retryTapIfNoChange: true
- assertVisible: "Mensagem para o MARVIN.*"
- tapOn: "Mensagem para o MARVIN.*"
- inputText: "teste de teclado"
- takeScreenshot: "02-keyboard"
- tapOn: "Fechar teclado"
- assertNotVisible: "Mensagem para o MARVIN.*"
- tapOn: "Biblioteca"
- assertVisible: "Documentos"
- tapOn: "Memórias"
- assertVisible: "Nova memória"
- takeScreenshot: "03-library"
- tapOn: "Atividades"
- assertVisible: "Minhas tarefas"
- takeScreenshot: "04-tasks"
- tapOn: "Dispositivos"
- assertVisible: "Vincular computador"
- tapOn: "MARVIN"
- tapOn: "Configurações"
- tapOn: "Voz e fala"
- assertVisible: "Responder em voz alta"
- scrollUntilVisible:
    element:
      text: "Automática"
    direction: DOWN
- assertVisible: "Automática"
- tapOn: "Alto-falante"
- assertNotVisible: "Não foi possível trocar a saída.*"
- tapOn: "Automática"
- assertNotVisible: "Não foi possível trocar a saída.*"
- takeScreenshot: "05-voice"
- stopApp
- openLink: "marvin://pair?v=1&h=192.168.1.12&p=8770&c=123456&k=%2B%2FAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA%3D&n=PC%20do%20simulador&s=simulator-test"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible: ".*PC do simulador.*"
- assertVisible: "São iguais · vincular"
- takeScreenshot: "06-cold-pair"
- openLink: "marvin://pair?v=1&h=192.168.1.12&p=8770&c=123456&k=%2B%2FAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA%3D&n=Outro%20PC%20do%20simulador&s=simulator-test"
- assertVisible: ".*Outro PC do simulador.*"
- assertVisible: "São iguais · vincular"
- takeScreenshot: "07-warm-pair"
- openLink: "marvin://pair?v=1&k=%25invalid"
- assertVisible: "Link de pareamento inválido.*"
- takeScreenshot: "08-invalid-pair"
